# Agent configuration for the real model (Anthropic, Claude API + SDK Tool Runner).
#
# Values approved for experiment 1 (19.10.2026). Verified against the official docs on 19.10.2026:
#   models:  https://platform.claude.com/docs/en/about-claude/models/overview
#   pricing: https://platform.claude.com/docs/en/about-claude/pricing
#   effort:  https://platform.claude.com/docs/en/build-with-claude/effort
#
# No secrets in this file: only the NAME of the environment variable that holds the API key.
# The worker also requires SV_TOTAL_BUDGET_USD (approved total cap for all paid runs: 5).
# No automatic model fallback: no `fallbacks` parameter is sent, and a response from any
# other model stops the task.

config_version: "1.0.0-exp1"
agent_name: "Skill Validator"

model:
  provider: anthropic                  # D1
  model_id: claude-opus-5-5            # O1 - approved for experiment 1
  effort: medium                       # O1 - approved; also the API default for this model
  max_output_tokens: 16000             # thinking + response; thinking is always on for this model
  pricing:                             # USD per million tokens
    input_per_mtok: 4.0
    output_per_mtok: 20.0              # thinking tokens are billed as output
    cache_write_per_mtok: 5.0          # 5-minute cache write
    cache_read_per_mtok: 0.20
    source: "platform.claude.com/docs/en/about-claude/pricing, checked 2026-10-19"

secrets:
  api_key_env: ANTHROPIC_API_KEY       # name only; the value never lives in the repo

prompts:
  system: prompts/system.md

stages:
  detect_purpose:
    prompt: prompts/tasks/detect_purpose.md
    tools: [list_files, read_file, record_purpose]
    read_areas: [source]
  analyze:
    prompt: prompts/tasks/analyze.md
    tools: [list_files, read_file, search_patterns, get_references, record_finding]
    read_areas: [source]
  propose_fix:
    prompt: prompts/tasks/propose_fix.md
    tools: [read_file, get_references, propose_patch]
    read_areas: [source]
  revalidate:
    prompt: prompts/tasks/revalidate.md
    tools: [list_files, read_file, search_patterns, get_references, compare_versions, record_validation]
    read_areas: [source, candidate]

limits:                                # O5 - approved for experiment 1
  per_task:                            # also the balance required to continue (D8)
    tokens: 150000
    cost_usd: 0.75
    processing_minutes: 5
  per_review:                          # cumulative ceilings; never reset on resume (D8)
    tokens: 1500000
    cost_usd: 3.0
    processing_minutes: 20
  max_approved_ceiling:                # highest ceiling a user may approve; equals the total cap
    tokens: 2500000
    cost_usd: 5.0
    processing_minutes: 30

stop_conditions:
  max_agent_turns_per_task: 12
  max_tool_calls_per_task: 30
  max_attempts_per_task: 2
  on_budget_exceeded: checkpoint_and_mark_partial
  on_tool_error: retry_then_checkpoint
  on_model_error_or_refusal: checkpoint_and_mark_partial

resume:                                # D8 - fixed; any other value is an error
  required_remaining: limits.per_task
  on_insufficient_budget: require_user_ceiling_approval
